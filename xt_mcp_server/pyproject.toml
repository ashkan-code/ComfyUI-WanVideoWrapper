[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "xt-mcp-server"
version = "1.0.0"
description = "MCP server for XT.com cryptocurrency exchange"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
xt-mcp-server = "server:main"

[tool.setuptools.packages.find]
where = ["."]
